<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КУРЬЕР • WHOPPER BAR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0d1b2a; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #f5a623; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .auth-card { background: white; border-radius: 40px; padding: 40px; max-width: 400px; margin: 50px auto; text-align: center; }
        .auth-card input { width: 100%; padding: 15px; border: 2px solid #f5a623; border-radius: 60px; margin: 15px 0; }
        .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .order-card { background: white; border-radius: 20px; padding: 20px; border-left: 6px solid #2196F3; margin-bottom: 15px; }
        .order-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .order-num { font-size: 1.3rem; font-weight: bold; color: #c53a1f; }
        .status-badge { padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; font-weight: bold; }
        .status-waiting { background: #ff9800; color: white; }
        .status-to_pickup { background: #2196F3; color: white; }
        .status-with_courier { background: #9c27b0; color: white; }
        .status-courier_arrived { background: #4CAF50; color: white; }
        .status-done { background: #999; color: white; }
        .btn { border: none; padding: 10px 20px; border-radius: 40px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; }
        .btn-depart { background: #2196F3; color: white; }
        .btn-arrived { background: #4CAF50; color: white; }
        .btn-deliver { background: #f5a623; color: #1a1a2e; }
        .code-input { display: flex; gap: 10px; margin-top: 10px; }
        .code-input input { flex: 1; padding: 10px; border: 2px solid #f5a623; border-radius: 40px; text-align: center; font-size: 1.2rem; letter-spacing: 3px; }
        .address-info { background: #e3f2fd; padding: 10px; border-radius: 15px; margin: 10px 0; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-truck"></i> КУРЬЕР • WHOPPER BAR</h1>
        
        <div id="ordersContainer">
            <div class="orders-grid" id="ordersGrid"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBlZ5ZtyTXgtXxSJAx1jOxwhTrzlHRJmo",
            authDomain: "bk-cashier.firebaseapp.com",
            databaseURL: "https://bk-cashier-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bk-cashier",
            storageBucket: "bk-cashier.firebasestorage.app",
            messagingSenderId: "385000840969",
            appId: "1:385000840969:web:1ec8d09176b6551dc0fdd8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let orders = {};

        function loadOrders() {
            db.ref('orders').on('value', (snapshot) => {
                orders = snapshot.val() || {};
                renderOrders();
            });
        }

        function getStatusText(status) {
            const map = {
                'waiting_pickup': '⏳ Ожидает отправки',
                'to_pickup': '🚚 Едет в ПВЗ',
                'with_courier': '🚚 У курьера',
                'courier_arrived': '🚪 Курьер приехал',
                'delivered': '📦 Выдан'
            };
            return map[status] || '⏳ Ожидает';
        }

        function renderOrders() {
            const grid = document.getElementById('ordersGrid');
            const ordersArray = Object.entries(orders).filter(([id, o]) => o.deliveryType === 'delivery' && o.status !== 'delivered');
            if(ordersArray.length === 0) { grid.innerHTML = '<div style="background:white; border-radius:20px; padding:40px; text-align:center;">Нет заказов на доставку</div>'; return; }
            
            grid.innerHTML = ordersArray.map(([id, o]) => {
                let actionHtml = '';
                if(o.status === 'waiting_pickup') {
                    actionHtml = `<button class="btn btn-depart" onclick="updateStatus('${id}', 'to_pickup')">🚚 Выехать к клиенту</button>`;
                } else if(o.status === 'with_courier') {
                    actionHtml = `<button class="btn btn-arrived" onclick="updateStatus('${id}', 'courier_arrived')">🚪 Курьер приехал</button>`;
                } else if(o.status === 'courier_arrived') {
                    actionHtml = `
                        <div class="code-input">
                            <input type="text" id="code-${id}" placeholder="6-значный код" maxlength="6">
                            <button class="btn btn-deliver" onclick="checkCodeAndDeliver('${id}')">📦 Выдать</button>
                        </div>
                    `;
                }
                
                return `
                    <div class="order-card">
                        <div class="order-header">
                            <span class="order-num">#${id}</span>
                            <span class="status-badge status-${o.status === 'with_courier' ? 'with_courier' : (o.status === 'courier_arrived' ? 'courier_arrived' : 'to_pickup')}">${getStatusText(o.status)}</span>
                        </div>
                        <div>${o.items.map(i => `${i.name} x${i.quantity}`).join(', ')}</div>
                        <div style="font-weight:bold; margin:10px 0;">${o.total} ₽</div>
                        ${o.address ? `<div class="address-info"><i class="fas fa-map-marker-alt"></i> ${o.address}</div>` : ''}
                        <div class="pickup-code" style="font-family:monospace; background:#f0f0f0; padding:8px; border-radius:10px; text-align:center;">Код клиента: ${o.pickupCode}</div>
                        ${actionHtml}
                    </div>
                `;
            }).join('');
        }

        window.updateStatus = (orderId, newStatus) => {
            db.ref('orders/' + orderId).update({ status: newStatus });
            if(newStatus === 'to_pickup') alert(`🚚 Заказ #${orderId} взят в доставку`);
            if(newStatus === 'courier_arrived') alert(`🚪 Курьер приехал к клиенту, запросите код у клиента`);
        };

        window.checkCodeAndDeliver = (orderId) => {
            const inputCode = document.getElementById(`code-${orderId}`).value;
            const order = orders[orderId];
            if(inputCode === order.pickupCode) {
                db.ref('orders/' + orderId).update({ status: 'delivered' });
                alert(`✅ Заказ #${orderId} выдан клиенту!`);
                const utterance = new SpeechSynthesisUtterance(`Заказ номер ${orderId} выдан`);
                utterance.lang = 'ru-RU';
                speechSynthesis.speak(utterance);
            } else {
                alert(`❌ Неверный код! Правильный код: ${order.pickupCode}`);
                const utterance = new SpeechSynthesisUtterance(`Неверный код`);
                utterance.lang = 'ru-RU';
                speechSynthesis.speak(utterance);
            }
        };

        loadOrders();
    </script>
</body>
</html>
